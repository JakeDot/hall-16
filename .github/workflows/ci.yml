name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  js-ts:
    name: JS / TS / HTML / CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (TypeScript)
        run: bun run lint

      - name: Build (bundles JS/TS, processes index.html and Tailwind CSS)
        run: bun run build

  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP syntax
        run: |
          set -e
          find php -name '*.php' -print0 | xargs -0 -n1 php -l
